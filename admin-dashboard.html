<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bes Artist | Global Admin Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #e5e5e5; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-pro { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 15px; width: 100%; outline: none; transition: 0.3s; color: white; }
        .input-pro:focus { border-color: #facc15; }
        .btn-main { background: #facc15; color: #000; font-weight: 900; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-main:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2); }
        select option { background: #1a1a1a; color: white; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="border-b border-white/5 py-6 px-8 flex justify-between items-center sticky top-0 bg-[#050505]/90 backdrop-blur-xl z-[100]">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-black font-black">B</div>
            <h1 class="artist-font text-sm uppercase tracking-tighter">Bes <span class="text-yellow-400">Admin</span></h1>
        </div>
        <div class="flex gap-4">
            <a href="gallery.html" class="text-[9px] font-bold uppercase border border-white/10 px-5 py-2 rounded-full hover:bg-white hover:text-black transition">Store</a>
            <button onclick="logout()" class="text-[9px] font-bold uppercase bg-red-600/10 text-red-500 px-5 py-2 rounded-full border border-red-500/20">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-12 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-8 space-y-10">
            <div class="glass p-10 rounded-[40px]">
                <h2 class="artist-font text-xs uppercase mb-10 flex items-center gap-3">
                    <i class="fa-solid fa-wand-magic-sparkles text-yellow-400"></i> Publish Masterpiece
                </h2>
                
                <form id="upload-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" id="title" placeholder="ARTWORK TITLE" required class="input-pro">
                        <input type="text" id="category" placeholder="CATEGORY (e.g. Canvas Oil)" class="input-pro">
                    </div>

                    <textarea id="description" placeholder="THE ARTWORK STORY (What inspired this?)" rows="3" class="input-pro"></textarea>

                    <div class="grid grid-cols-1 gap-6">
                        <div class="relative">
                            <input type="file" id="image_file" accept="image/*" class="hidden" onchange="updateLabel('image_file', 'main-label')">
                            <label for="image_file" id="main-label" class="input-pro block cursor-pointer text-center text-gray-500 hover:text-yellow-400 border-dashed border-2">
                                <i class="fa-solid fa-crown mr-2"></i> UPLOAD FINAL MASTERPIECE (Required)
                            </label>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="relative">
                                <input type="file" id="stage_1_file" accept="image/*" class="hidden" onchange="updateLabel('stage_1_file', 's1-label')">
                                <label for="stage_1_file" id="s1-label" class="input-pro block cursor-pointer text-center text-gray-500 hover:text-yellow-400 text-xs">
                                    <i class="fa-solid fa-1 mr-2"></i> STAGE 1: SKETCH
                                </label>
                            </div>
                            <div class="relative">
                                <input type="file" id="stage_2_file" accept="image/*" class="hidden" onchange="updateLabel('stage_2_file', 's2-label')">
                                <label for="stage_2_file" id="s2-label" class="input-pro block cursor-pointer text-center text-gray-500 hover:text-yellow-400 text-xs">
                                    <i class="fa-solid fa-2 mr-2"></i> STAGE 2: PROCESS
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <select id="currency" class="input-pro font-bold text-xs uppercase">
                            <option value="TZS">TZS (Tsh)</option>
                            <option value="USD">USD ($)</option>
                        </select>
                        <input type="number" id="price" placeholder="PRICE" required class="input-pro">
                        <input type="number" id="sale_price" placeholder="SALE PRICE" class="input-pro">
                        <select id="stock_status" class="input-pro font-bold text-xs uppercase">
                            <option value="Available">AVAILABLE</option>
                            <option value="Sold Out">SOLD OUT</option>
                        </select>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full btn-main py-6 rounded-2xl artist-font text-[10px]">Release Internationally</button>
                </form>
            </div>

            <div class="glass p-10 rounded-[40px]">
                <h3 class="artist-font text-xs uppercase mb-8 flex justify-between items-center">
                    <span>Live Inventory</span>
                    <span class="text-[9px] text-gray-500" id="item-count">0 Items</span>
                </h3>
                <div id="art-list" class="space-y-4"></div>
            </div>
        </div>

        <div class="lg:col-span-4 space-y-10">
            <div class="glass p-8 rounded-[40px]">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="artist-font text-xs uppercase">Collector List</h3>
                    <button onclick="emailAll()" class="text-[8px] font-black bg-yellow-400 text-black px-4 py-2 rounded-lg uppercase transition-transform active:scale-95">Broadcast</button>
                </div>
                <div id="sub-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>

            <div class="glass p-8 rounded-[40px]">
                <h3 class="artist-font text-xs uppercase mb-6 text-gray-400">Vault Security</h3>
                <form id="pw-form" class="space-y-4">
                    <input type="password" id="new-pw" placeholder="NEW MASTER KEY" required class="input-pro text-sm">
                    <button type="submit" class="w-full bg-white text-black py-4 rounded-xl font-black text-[10px] uppercase hover:bg-yellow-400 transition-colors">Update Key</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = 'gallery.html';
            else loadData();
        }

        // FUNCTION YA KUTUMA EMAIL KWA WOTE
        async function emailAll() {
            const { data: subs, error } = await supabaseClient.from('subscribers').select('email');
            if (error || !subs || subs.length === 0) {
                alert("Hakuna collectors waliopatikana.");
                return;
            }

            const emails = subs.map(s => s.email).join(',');
            const subject = encodeURIComponent("Bes Artist | New Masterpiece Alert");
            const body = encodeURIComponent("Habari Collector,\n\nThere is a new artistic work in  showroo just now. Welcome to look for it.\n\nVisit here: https://github.com/mihsso001-pixel/BES-artist/\n\nBest Regards,\nBes Artist.");
            
            // Inafungua barua pepe ikiwa imeweka emails zote kwenye sehemu ya wapokeaji (BCC is better but for simple trigger we use To)
            window.location.href = `mailto:${emails}?subject=${subject}&body=${body}`;
        }

        function updateLabel(inputId, labelId) {
            const file = document.getElementById(inputId).files[0];
            if(file) document.getElementById(labelId).innerHTML = `<i class="fa-solid fa-check-circle text-green-500 mr-2"></i> ${file.name.substring(0, 15)}...`;
        }

        async function uploadFile(file) {
            if (!file) return null;
            const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`;
            const { data, error } = await supabaseClient.storage.from('artworks').upload(fileName, file);
            if (error) throw error;
            const { data: pUrl } = supabaseClient.storage.from('artworks').getPublicUrl(fileName);
            return pUrl.publicUrl;
        }

        async function loadData() {
            const { data: arts } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
            const { data: subs } = await supabaseClient.from('subscribers').select('*').order('created_at', { ascending: false });

            document.getElementById('item-count').innerText = `${arts ? arts.length : 0} Artworks`;
            
            const artDiv = document.getElementById('art-list');
            artDiv.innerHTML = arts ? arts.map(a => {
                const isSold = a.stock_status === 'Sold Out';
                return `
                <div class="flex items-center justify-between p-5 bg-white/5 rounded-[30px] border border-white/5 hover:border-yellow-400/30 transition-all group">
                    <div class="flex items-center gap-5">
                        <div class="relative w-16 h-16 shrink-0">
                            <img src="${a.image_url}" class="w-full h-full rounded-2xl object-cover">
                            ${isSold ? '<div class="absolute inset-0 bg-red-600/20 rounded-2xl border border-red-500/50 flex items-center justify-center text-[7px] font-black tracking-tighter">SOLD</div>' : ''}
                        </div>
                        <div>
                            <p class="text-[10px] font-bold uppercase tracking-widest">${a.title}</p>
                            <p class="text-[8px] opacity-40 uppercase mb-3">${a.category} • ${a.currency} ${a.price}</p>
                            <button onclick="toggleStatus('${a.id}', '${isSold ? 'Available' : 'Sold Out'}')" 
                                class="text-[7px] font-black px-4 py-1.5 rounded-full border ${isSold ? 'border-green-500/50 text-green-500' : 'border-red-500/50 text-red-500'} uppercase hover:bg-white hover:text-black transition">
                                Mark as ${isSold ? 'Available' : 'Sold Out'}
                            </button>
                        </div>
                    </div>
                    <button onclick="deleteArt('${a.id}')" class="w-12 h-12 flex items-center justify-center rounded-full bg-red-600/5 text-red-500 hover:bg-red-600 hover:text-white transition-all">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            `}).join('') : '';

            document.getElementById('sub-list').innerHTML = subs ? subs.map(s => `
                <div class="p-4 bg-white/5 rounded-2xl text-[10px] font-bold flex justify-between border border-white/5">
                    ${s.email}
                    <a href="mailto:${s.email}" class="text-yellow-400"><i class="fa-solid fa-paper-plane"></i></a>
                </div>
            `).join('') : '';
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "UPLOADING MASTERPIECE...";
            btn.disabled = true;

            try {
                const mainFile = document.getElementById('image_file').files[0];
                if(!mainFile) throw new Error("Please upload the final artwork image.");

                const mainUrl = await uploadFile(mainFile);
                const s1Url = await uploadFile(document.getElementById('stage_1_file').files[0]);
                const s2Url = await uploadFile(document.getElementById('stage_2_file').files[0]);

                const { error } = await supabaseClient.from('gallery').insert([{
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    description: document.getElementById('description').value,
                    image_url: mainUrl,
                    stage_1_url: s1Url,
                    stage_2_url: s2Url,
                    price: document.getElementById('price').value,
                    sale_price: document.getElementById('sale_price').value || null,
                    currency: document.getElementById('currency').value,
                    stock_status: document.getElementById('stock_status').value,
                    is_sale: document.getElementById('sale_price').value ? true : false
                }]);

                if (error) throw error;
                alert("Masterpiece has been added to the showroom.");
                location.reload();

            } catch (err) {
                alert("Vault Error: " + err.message);
            } finally {
                btn.innerText = "Release Internationally";
                btn.disabled = false;
            }
        });

        async function toggleStatus(id, newStatus) {
            const { error } = await supabaseClient.from('gallery').update({ stock_status: newStatus }).eq('id', id);
            if(!error) loadData();
        }

        async function deleteArt(id) {
            if(confirm('Kaka, ufute mchoro huu kabisa?')) {
                const { error } = await supabaseClient.from('gallery').delete().eq('id', id);
                if(!error) loadData();
            }
        }

        async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'gallery.html'; }
        checkAuth();
    </script>
</body>
</html>
