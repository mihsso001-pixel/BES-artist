<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bes Artist | Global Admin Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #e5e5e5; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-pro { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 15px; width: 100%; outline: none; transition: 0.3s; color: white; }
        .input-pro:focus { border-color: #facc15; }
        .btn-main { background: #facc15; color: #000; font-weight: 900; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-main:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2); }
        select option { background: #1a1a1a; color: white; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="border-b border-white/5 py-6 px-8 flex justify-between items-center sticky top-0 bg-[#050505]/90 backdrop-blur-xl z-[100]">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-black font-black">B</div>
            <h1 class="artist-font text-sm uppercase tracking-tighter">Bes <span class="text-yellow-400">Admin</span></h1>
        </div>
        <div class="flex gap-4">
            <a href="gallery.html" class="text-[9px] font-bold uppercase border border-white/10 px-5 py-2 rounded-full hover:bg-white hover:text-black transition">Store</a>
            <button onclick="logout()" class="text-[9px] font-bold uppercase bg-red-600/10 text-red-500 px-5 py-2 rounded-full border border-red-500/20">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-12 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-8 space-y-10">
            <div class="glass p-10 rounded-[40px]">
                <h2 class="artist-font text-xs uppercase mb-10 flex items-center gap-3">
                    <i class="fa-solid fa-cloud-arrow-up text-yellow-400"></i> New Global Release
                </h2>
                
                <form id="upload-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" id="title" placeholder="ARTWORK TITLE" required class="input-pro">
                        <input type="text" id="category" placeholder="CATEGORY (e.g. Digital Art)" class="input-pro">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="url" id="image_url" placeholder="IMAGE LINK (URL)" class="input-pro">
                        <div class="relative">
                            <input type="file" id="image_file" accept="image/*" class="hidden" onchange="previewLabel()">
                            <label for="image_file" id="file-label" class="input-pro block cursor-pointer text-center text-gray-500 hover:text-yellow-400">
                                <i class="fa-solid fa-file-image mr-2"></i> UPLOAD FROM DEVICE
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <select id="currency" class="input-pro font-bold">
                            <option value="TZS">TZS (Tsh)</option>
                            <option value="USD">USD ($)</option>
                        </select>
                        <input type="number" id="price" placeholder="REGULAR PRICE" required class="input-pro">
                        <input type="number" id="sale_price" placeholder="SALE PRICE" class="input-pro">
                        <select id="stock_status" class="input-pro font-bold">
                            <option value="Available">AVAILABLE</option>
                            <option value="Sold Out">SOLD OUT</option>
                        </select>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full btn-main py-6 rounded-2xl artist-font text-[10px]">Publish Masterpiece</button>
                </form>
            </div>

            <div class="glass p-10 rounded-[40px]">
                <h3 class="artist-font text-xs uppercase mb-8">Manage Inventory</h3>
                <div id="art-list" class="space-y-4"></div>
            </div>
        </div>

        <div class="lg:col-span-4 space-y-10">
            <div class="glass p-8 rounded-[40px]">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="artist-font text-xs uppercase">Subscribers</h3>
                    <button onclick="emailAll()" class="text-[8px] font-black bg-yellow-400 text-black px-4 py-2 rounded-lg uppercase">Email All</button>
                </div>
                <div id="sub-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>

            <div class="glass p-8 rounded-[40px]">
                <h3 class="artist-font text-xs uppercase mb-6 text-gray-400">Security</h3>
                <form id="pw-form" class="space-y-4">
                    <input type="password" id="new-pw" placeholder="NEW PASSWORD" required class="input-pro text-sm">
                    <button type="submit" class="w-full bg-white text-black py-4 rounded-xl font-black text-[10px] uppercase">Update Secret Key</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'gallery.html';
            } else {
                loadData();
            }
        }

        function previewLabel() {
            const file = document.getElementById('image_file').files[0];
            if(file) document.getElementById('file-label').innerText = "SELECTED: " + file.name;
        }

        async function loadData() {
            const { data: arts, error: artErr } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
            const { data: subs, error: subErr } = await supabaseClient.from('subscribers').select('*').order('created_at', { ascending: false });

            if(artErr) console.error("Load Art Error:", artErr);
            if(subErr) console.error("Load Subs Error:", subErr);

            const artDiv = document.getElementById('art-list');
            artDiv.innerHTML = arts ? arts.map(a => `
                <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <div class="flex items-center gap-4">
                        <img src="${a.image_url}" class="w-12 h-12 rounded-lg object-cover" onerror="this.src='https://via.placeholder.com/50'">
                        <div>
                            <p class="text-[10px] font-bold uppercase">${a.title} ${a.stock_status === 'Sold Out' ? '<span class="text-red-500 ml-2">[SOLD]</span>' : ''}</p>
                            <p class="text-[8px] opacity-40 uppercase">${a.currency} ${a.price} • ${a.category}</p>
                        </div>
                    </div>
                    <button onclick="deleteArt('${a.id}')" class="text-gray-600 hover:text-red-500 transition"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('') : '<p class="text-xs text-gray-600 uppercase tracking-widest">No inventory found</p>';

            document.getElementById('sub-list').innerHTML = subs ? subs.map(s => `
                <div class="p-4 bg-white/5 rounded-xl text-[10px] font-bold flex justify-between">
                    ${s.email}
                    <a href="mailto:${s.email}" class="text-yellow-400"><i class="fa-solid fa-paper-plane"></i></a>
                </div>
            `).join('') : '<p class="text-xs text-gray-600 uppercase tracking-widest text-center mt-4">No subscribers yet</p>';
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "PROCESSING...";
            btn.disabled = true;

            try {
                let finalUrl = document.getElementById('image_url').value;
                const file = document.getElementById('image_file').files[0];

                if (file) {
                    const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`;
                    const { data: storageData, error: storageError } = await supabaseClient
                        .storage
                        .from('artworks')
                        .upload(fileName, file);

                    if (storageError) throw storageError;

                    const { data: publicUrlData } = supabaseClient
                        .storage
                        .from('artworks')
                        .getPublicUrl(fileName);
                    
                    finalUrl = publicUrlData.publicUrl;
                }

                if (!finalUrl) throw new Error("Please provide an image link or upload a file.");

                const { error: tableError } = await supabaseClient.from('gallery').insert([{
                    title: document.getElementById('title').value,
                    category: document.getElementById('category').value,
                    image_url: finalUrl,
                    price: document.getElementById('price').value,
                    sale_price: document.getElementById('sale_price').value || null,
                    currency: document.getElementById('currency').value,
                    stock_status: document.getElementById('stock_status').value,
                    is_sale: document.getElementById('sale_price').value ? true : false
                }]);

                if (tableError) throw tableError;

                alert("SUCCESS! Artwork published globally.");
                location.reload();

            } catch (err) {
                console.error("Critical Error:", err);
                alert("ERROR: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('pw-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.auth.updateUser({ password: document.getElementById('new-pw').value });
            if (error) alert("Pass Update Failed: " + error.message);
            else alert('Security Key Updated Successfully!');
        });

        async function deleteArt(id) {
            if(confirm('Permanently delete this artwork from gallery?')) {
                const { error } = await supabaseClient.from('gallery').delete().eq('id', id);
                if(error) alert("Delete failed: " + error.message);
                else loadData();
            }
        }

        function emailAll() {
            const emails = Array.from(document.querySelectorAll('#sub-list div')).map(d => d.innerText.trim());
            if(emails.length === 0) return alert("No subscribers to email.");
            window.location.href = `mailto:?bcc=${emails.join(',')}&subject=Exclusive Art Release - Bes Artist&body=Discover my latest masterpieces at the gallery!`;
        }

        async function logout() { 
            await supabaseClient.auth.signOut(); 
            window.location.href = 'gallery.html'; 
        }

        checkAuth();
    </script>
</body>
</html>
