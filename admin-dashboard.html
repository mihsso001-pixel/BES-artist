<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bes Artist | Global Admin Command</title>
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #e5e5e5; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-pro { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 15px; width: 100%; outline: none; transition: 0.3s; color: white; }
        .input-pro:focus { border-color: #facc15; }
        .btn-main { background: #facc15; color: #000; font-weight: 900; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-main:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="border-b border-white/5 py-6 px-8 flex justify-between items-center sticky top-0 bg-[#050505]/90 backdrop-blur-xl z-[100]">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-black font-black">B</div>
            <h1 class="artist-font text-sm uppercase tracking-tighter">Bes <span class="text-yellow-400">Admin</span></h1>
        </div>
        <div class="flex gap-4">
            <a href="gallery.html" class="text-[9px] font-bold uppercase border border-white/10 px-5 py-2 rounded-full hover:bg-white hover:text-black transition">Store</a>
            <button onclick="logout()" class="text-[9px] font-bold uppercase bg-red-600/10 text-red-500 px-5 py-2 rounded-full border border-red-500/20">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-12 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-8 space-y-10">
            <div class="glass p-10 rounded-[40px]">
                <h2 class="artist-font text-xs uppercase mb-10 flex items-center gap-3">
                    <i class="fa-solid fa-wand-magic-sparkles text-yellow-400"></i> Publish Masterpiece
                </h2>
                
                <form id="upload-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" id="title" placeholder="ARTWORK TITLE" required class="input-pro">
                        <input type="text" id="category" placeholder="CATEGORY" class="input-pro">
                    </div>
                    <textarea id="description" placeholder="THE ARTWORK STORY" rows="3" class="input-pro"></textarea>
                    
                    <div class="relative">
                        <input type="file" id="image_file" accept="image/*" class="hidden" onchange="updateLabel('image_file', 'main-label')">
                        <label for="image_file" id="main-label" class="input-pro block cursor-pointer text-center text-gray-500 border-dashed border-2">UPLOAD FINAL ARTWORK</label>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <select id="currency" class="input-pro font-bold text-xs uppercase">
                            <option value="TZS">TZS</option>
                            <option value="USD">USD</option>
                        </select>
                        <input type="number" id="price" placeholder="PRICE" required class="input-pro">
                        <input type="number" id="sale_price" placeholder="SALE PRICE" class="input-pro">
                        <select id="stock_status" class="input-pro font-bold text-xs uppercase">
                            <option value="Available">AVAILABLE</option>
                            <option value="Sold Out">SOLD OUT</option>
                        </select>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full btn-main py-6 rounded-2xl artist-font text-[10px]">Release Internationally</button>
                </form>
            </div>

            <div class="glass p-10 rounded-[40px]">
                <h3 class="artist-font text-xs uppercase mb-8 flex items-center gap-3">
                    <i class="fa-brands fa-tiktok text-pink-500"></i> TikTok Creative Feed
                </h3>
                <form id="tiktok-form" class="space-y-4 mb-10">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="v_id_input" placeholder="TIKTOK VIDEO ID" required class="input-pro text-sm">
                        <input type="text" id="v_url_input" placeholder="FULL TIKTOK URL (LINK)" required class="input-pro text-sm">
                    </div>
                    <button type="submit" id="add-video-btn" class="w-full bg-white text-black py-4 rounded-xl font-black text-[10px] uppercase hover:bg-yellow-400 transition-colors">Add Creative Video</button>
                </form>
                <div id="admin-tiktok-list" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>

            <div class="glass p-10 rounded-[40px]">
                <h3 class="artist-font text-xs uppercase mb-8 flex justify-between items-center">
                    <span>Live Inventory</span>
                    <span class="text-[9px] text-gray-500" id="item-count">0 Items</span>
                </h3>
                <div id="art-list" class="space-y-4"></div>
            </div>
        </div>

        <div class="lg:col-span-4 space-y-10">
            <div class="glass p-8 rounded-[40px]">
                <h3 class="artist-font text-xs uppercase mb-8">Collector Base</h3>
                <div id="sub-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar"></div>
                <button onclick="emailAll()" class="w-full mt-6 bg-yellow-400 text-black py-4 rounded-xl font-black text-[10px] uppercase hover:scale-[1.02] transition">Broadcast Update</button>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = 'gallery.html';
            else loadData();
        }

        async function loadData() {
            const { data: arts } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
            const { data: subs } = await supabaseClient.from('subscribers').select('*').order('created_at', { ascending: false });
            const { data: vids } = await supabaseClient.from('videos').select('*').order('created_at', { ascending: false });

            document.getElementById('item-count').innerText = `${arts ? arts.length : 0} Masterpieces`;
            
            // Render Arts
            document.getElementById('art-list').innerHTML = arts ? arts.map(a => `
                <div class="flex items-center justify-between p-5 bg-white/5 rounded-[30px] border border-white/5">
                    <div class="flex items-center gap-5">
                        <img src="${a.image_url}" class="w-16 h-16 rounded-2xl object-cover">
                        <p class="text-[10px] font-bold uppercase">${a.title}</p>
                    </div>
                    <button onclick="deleteArt('${a.id}')" class="text-red-500 hover:text-white transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                </div>`).join('') : '';

            // Render TikToks - Using id for deletion, video_id for display
            document.getElementById('admin-tiktok-list').innerHTML = vids ? vids.map(v => `
                <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center">
                    <p class="text-[8px] font-bold text-yellow-400 mb-1">ID: ${v.video_id}</p>
                    <p class="text-[7px] opacity-30 truncate mb-3">${v.link}</p>
                    <button onclick="deleteVideo(${v.id})" class="w-full bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white py-2 rounded-lg text-[8px] font-black uppercase transition-all">
                        Remove
                    </button>
                </div>`).join('') : '';

            document.getElementById('sub-list').innerHTML = subs ? subs.map(s => `
                <div class="p-4 bg-white/5 rounded-2xl text-[10px] font-bold border border-white/5">${s.email}</div>`).join('') : '';
        }

        // TIKTOK: ADD (Using link and video_id columns)
        document.getElementById('tiktok-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('add-video-btn');
            const vId = document.getElementById('v_id_input').value.trim();
            const vLink = document.getElementById('v_url_input').value.trim();
            
            btn.innerText = "SYNCHRONIZING..."; btn.disabled = true;
            
            const { error } = await supabaseClient.from('videos').insert([{ 
                video_id: vId,
                link: vLink 
            }]);

            if(!error) {
                document.getElementById('v_id_input').value = '';
                document.getElementById('v_url_input').value = '';
                loadData();
            } else { alert("Sync Error: " + error.message); }
            btn.innerText = "Add Creative Video"; btn.disabled = false;
        });

        // TIKTOK: DELETE (Using primary key 'id')
        async function deleteVideo(rowId) {
            if(confirm('Are you sure you want to permanently remove this video from the database?')) {
                const { error } = await supabaseClient
                    .from('videos')
                    .delete()
                    .eq('id', rowId);

                if(!error) loadData();
                else alert("Delete failed: " + error.message);
            }
        }

        async function emailAll() {
            const { data: subs } = await supabaseClient.from('subscribers').select('email');
            if (!subs || subs.length === 0) return alert("Collector list is empty.");
            const emails = subs.map(s => s.email).join(',');
            const subject = encodeURIComponent("New Masterpiece Unveiled | Bes Artist");
            const body = encodeURIComponent("Hello,\n\nA new artwork has been added to the collection. Explore the latest release here: https://github.com/mihsso001-pixel/BES-artist/");
            window.location.href = `mailto:${emails}?subject=${subject}&body=${body}`;
        }

        function updateLabel(id, labelId) {
            const file = document.getElementById(id).files[0];
            if(file) document.getElementById(labelId).innerText = file.name;
        }

        async function deleteArt(id) {
            if(confirm('Delete this artwork?')) {
                const { error } = await supabaseClient.from('gallery').delete().eq('id', id);
                if(!error) loadData();
            }
        }

        async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'gallery.html'; }
        checkAuth();
    </script>
</body>
</html>
