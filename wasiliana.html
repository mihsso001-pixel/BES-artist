<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bes Artist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        .outline-text { color: transparent; -webkit-text-stroke: 1px black; }
        
        /* Matching the Index Nav */
        .moving-nav {
            background: linear-gradient(-45deg, #facc15, #000000, #ffffff, #facc15);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Large Circle Logo */
        .logo-circle {
            width: 70px; height: 70px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @media (min-width: 768px) { .logo-circle { width: 90px; height: 90px; } }

        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .contact-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .contact-card:hover {
            transform: translateY(-10px);
            border-color: #facc15;
        }
    </style>
</head>
<body class="bg-[#fafafa] text-[#1a1a1a]">

    <nav class="moving-nav fixed w-full z-[100] border-b border-gray-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-6 h-28 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="Bes Artist" class="logo-circle transition-transform hover:scale-110">
            </a>

            <div class="hidden md:flex space-x-10 font-bold text-[11px] tracking-[0.2em] uppercase text-white">
                <a href="index.html" class="hover:text-yellow-400 transition">Home</a>
                <a href="gallery.html" class="hover:text-yellow-400 transition">Gallery</a>
                <a href="kuhusu.html" class="hover:text-yellow-400 transition">About</a>
                <a href="wasiliana.html" class="border-b-2 border-yellow-400 text-yellow-400">Contact</a>
            </div>

            <button onclick="toggleMenu()" class="md:hidden text-white text-3xl focus:outline-none">
                <i class="fa-solid fa-bars-staggered" id="menu-icon"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden flex-col bg-black text-white p-6 space-y-4 font-bold text-center tracking-widest uppercase text-xs border-t border-gray-800">
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="kuhusu.html">About</a>
            <a href="wasiliana.html" class="text-yellow-400">Contact</a>
        </div>
    </nav>

    <main class="pt-56 pb-20 px-6">
        <div class="max-w-5xl mx-auto text-center">
            
            <div class="mb-20 reveal">
                <span class="inline-block py-1 px-4 mb-6 text-[10px] font-bold tracking-[0.4em] bg-black text-white rounded-full uppercase">Get In Touch</span>
                <h1 class="artist-font text-5xl md:text-8xl leading-[0.9] uppercase">
                    LET'S <br> <span class="outline-text">CONNECT.</span>
                </h1>
                <p class="max-w-lg mx-auto text-gray-500 mt-8 text-sm uppercase tracking-widest font-bold">Available for commissions, collaborations, and inquiries.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-20 reveal">
                
                <a href="mailto:your-email@example.com" class="contact-card bg-white p-12 rounded-[2rem] shadow-xl border border-gray-100 flex flex-col items-center group">
                    <div class="w-16 h-16 bg-black text-white rounded-full flex items-center justify-center text-2xl mb-6 group-hover:bg-yellow-400 group-hover:text-black transition-colors">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <h3 class="artist-font text-xl uppercase mb-2">Email Me</h3>
                    <p class="text-gray-400 text-sm tracking-widest">hello@besartist.com</p>
                </a>

                <a href="https://wa.me/255XXXXXXXXX" target="_blank" class="contact-card bg-white p-12 rounded-[2rem] shadow-xl border border-gray-100 flex flex-col items-center group">
                    <div class="w-16 h-16 bg-black text-white rounded-full flex items-center justify-center text-2xl mb-6 group-hover:bg-green-500 transition-colors">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <h3 class="artist-font text-xl uppercase mb-2">WhatsApp</h3>
                    <p class="text-gray-400 text-sm tracking-widest">+255 (0) XXX XXX XXX</p>
                </a>

            </div>

            <div class="reveal">
                <h2 class="artist-font text-xl uppercase mb-12 tracking-[0.3em]">Social Media</h2>
                <div class="flex flex-wrap justify-center gap-6 md:gap-12">
                    <a href="#" class="w-20 h-20 bg-white shadow-lg rounded-2xl flex items-center justify-center text-3xl hover:text-pink-600 hover:scale-110 transition duration-300 border border-gray-50"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="w-20 h-20 bg-white shadow-lg rounded-2xl flex items-center justify-center text-3xl hover:text-black hover:scale-110 transition duration-300 border border-gray-50"><i class="fa-brands fa-tiktok"></i></a>
                    <a href="#" class="w-20 h-20 bg-white shadow-lg rounded-2xl flex items-center justify-center text-3xl hover:text-red-600 hover:scale-110 transition duration-300 border border-gray-50"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#" class="w-20 h-20 bg-white shadow-lg rounded-2xl flex items-center justify-center text-3xl hover:text-blue-600 hover:scale-110 transition duration-300 border border-gray-50"><i class="fa-brands fa-facebook"></i></a>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-black text-white py-16 px-6 text-center border-t border-gray-800 mt-20">
        <div class="max-w-7xl mx-auto">
            <h3 class="artist-font text-2xl mb-8 outline-text uppercase">Bes Artist.</h3>
            <div class="pt-8 border-t border-gray-900 text-[10px] tracking-[0.4em] text-gray-600 uppercase font-bold">
                &copy; 2026 Bes Artist | Visual Content Creator
            </div>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            
            if (menu.classList.contains('flex')) {
                icon.classList.replace('fa-bars-staggered', 'fa-xmark');
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars-staggered');
            }
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
    </script>
</body>
</html>
