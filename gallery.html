<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Art Store | Bes Artist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; overflow-x: hidden; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        .outline-text { color: transparent; -webkit-text-stroke: 1px black; }
        
        .moving-nav {
            background: linear-gradient(-45deg, #facc15, #000000, #ffffff, #facc15);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-circle { 
            width: 70px; height: 70px; border-radius: 50%; object-fit: cover; 
            border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.3s;
        }

        .art-card { transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .art-card:hover { transform: translateY(-15px); }
        
        .sale-badge {
            position: absolute; top: 20px; left: 20px;
            background: #ff0000; color: white; padding: 5px 15px;
            font-size: 10px; font-weight: 900; border-radius: 50px; z-index: 10;
        }

        .sold-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px); z-index: 20; display: flex;
            align-items: center; justify-content: center;
        }
        .sold-tag {
            border: 3px solid white; color: white; padding: 10px 25px;
            font-family: 'Unbounded', sans-serif; transform: rotate(-15deg);
            font-size: 14px; letter-spacing: 3px;
        }

        #admin-modal { display: none; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); }
    </style>
</head>
<body class="text-[#1a1a1a]">

    <nav class="moving-nav fixed w-full z-[100] border-b border-gray-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-6 h-28 flex justify-between items-center">
            <div class="flex items-center">
                <img src="logo.png" alt="Bes Artist" class="logo-circle" id="secret-logo">
            </div>

            <div class="hidden md:flex items-center space-x-10 font-bold text-[11px] tracking-[0.2em] uppercase text-white">
                <a href="index.html" class="hover:text-yellow-400 transition">Home</a>
                <a href="gallery.html" class="border-b-2 border-yellow-400 text-yellow-400">Store</a>
                <a href="kuhusu.html" class="hover:text-yellow-400 transition">About</a>
                <a href="wasiliana.html" class="hover:text-yellow-400 transition">Contact</a>
            </div>

            <button onclick="toggleMenu()" class="md:hidden text-white text-3xl focus:outline-none">
                <i class="fa-solid fa-bars-staggered" id="menu-icon"></i>
            </button>
        </div>
        
        <div id="mobile-menu" class="hidden flex-col bg-black text-white p-8 space-y-6 font-bold text-center tracking-widest uppercase text-xs border-t border-gray-900 shadow-2xl">
            <a href="index.html">Home</a>
            <a href="gallery.html" class="text-yellow-400">Store</a>
            <a href="kuhusu.html">About</a>
            <a href="wasiliana.html">Contact</a>
        </div>
    </nav>

    <main class="pt-56 pb-20 px-6">
        <div class="max-w-7xl mx-auto text-center md:text-left">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-8 mb-20">
                <div>
                    <span class="inline-block py-1 px-4 mb-4 text-[10px] font-bold tracking-[0.4em] bg-black text-white rounded-full uppercase">Global Art Release</span>
                    <h1 class="artist-font text-5xl md:text-8xl uppercase leading-none">
                        THE <br> <span class="outline-text">SHOWROOM.</span>
                    </h1>
                </div>
                <div class="pb-2">
                    <p class="text-gray-400 text-xs font-bold uppercase tracking-[0.3em] max-w-xs">Curated masterpieces for international collectors by Brian Erick.</p>
                </div>
            </div>

            <div id="shop-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-12">
                </div>
        </div>
    </main>

    <section class="bg-black py-32 px-6 text-white text-center border-t border-gray-900">
        <div class="max-w-2xl mx-auto">
            <h2 class="artist-font text-3xl md:text-5xl mb-8 uppercase">Collector's <span class="text-yellow-400">Circle</span></h2>
            <p class="text-gray-400 mb-12 tracking-widest uppercase text-[10px] font-bold">Join the newsletter for exclusive early access to new collections.</p>
            
            <form id="newsletter-form" class="flex flex-col sm:flex-row gap-4">
                <input type="email" id="subscriber-email" placeholder="EMAIL ADDRESS" required class="flex-1 bg-white/5 border border-white/10 px-8 py-5 rounded-2xl focus:border-yellow-400 outline-none text-sm">
                <button type="submit" class="bg-yellow-400 text-black px-12 py-5 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-white transition-all">Join Now</button>
            </form>
            <p id="news-status" class="mt-4 text-[10px] uppercase font-bold text-yellow-400 hidden"></p>
        </div>
    </section>

    <footer class="bg-black text-white py-20 px-6 text-center border-t border-gray-900">
        <div class="max-w-7xl mx-auto text-gray-500 font-bold text-[9px] tracking-[0.4em] uppercase">
            &copy; 2026 Bes Artist | All Rights Reserved
        </div>
    </footer>

    <div id="admin-modal" class="fixed inset-0 z-[200] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[40px] p-12 relative shadow-2xl">
            <button onclick="closeAdmin()" class="absolute top-8 right-8 text-gray-300 hover:text-black text-3xl">&times;</button>
            <h2 class="artist-font text-xl uppercase mb-8 text-center">Admin Portal</h2>
            <form id="admin-login-form" class="space-y-6">
                <input type="email" id="admin-email" placeholder="ADMIN EMAIL" required class="w-full bg-gray-50 p-5 rounded-2xl border border-gray-100 outline-none focus:border-black">
                <input type="password" id="admin-password" placeholder="SECRET KEY" required class="w-full bg-gray-50 p-5 rounded-2xl border border-gray-100 outline-none focus:border-black">
                <button type="submit" class="w-full bg-black text-white py-5 rounded-2xl artist-font text-[10px] uppercase tracking-[0.3em]">Verify Identity</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        // Secret Logo Long Press (3 sec)
        let logoTimer;
        const secretLogo = document.getElementById('secret-logo');
        secretLogo.addEventListener('mousedown', () => logoTimer = setTimeout(openAdmin, 3000));
        secretLogo.addEventListener('mouseup', () => clearTimeout(logoTimer));
        secretLogo.addEventListener('touchstart', () => logoTimer = setTimeout(openAdmin, 3000));
        secretLogo.addEventListener('touchend', () => clearTimeout(logoTimer));

        function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; }
        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

        // Login
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('admin-email').value,
                password: document.getElementById('admin-password').value
            });
            if (error) alert("Access Denied");
            else window.location.href = 'admin-dashboard.html';
        });

        // Load Shop
        async function loadShop() {
            const grid = document.getElementById('shop-grid');
            const { data } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });

            if (data && data.length > 0) {
                grid.innerHTML = data.map(item => {
                    const isSold = item.stock_status === 'Sold Out';
                    const symbol = item.currency === 'USD' ? '$' : 'Tsh';
                    
                    const priceHTML = item.is_sale ? 
                        `<span class="text-red-600 font-black">${symbol} ${item.sale_price}</span> <span class="line-through text-gray-400 text-[10px] ml-2 font-normal">${symbol} ${item.price}</span>` : 
                        `<span class="font-black">${symbol} ${item.price}</span>`;

                    // UJUMBE WA WHATSAPP KWA KINGEREZA
                    const waText = encodeURIComponent(`Hello Bes Artist, I'm interested in the artwork "${item.title}".\n\nPrice: ${symbol} ${item.is_sale ? item.sale_price : item.price}\nReference: ${item.image_url}`);
                    const waLink = `https://wa.me/255754494949?text=${waText}`;

                    return `
                        <div class="art-card bg-white rounded-[40px] overflow-hidden shadow-2xl border border-gray-100 relative group">
                            ${isSold ? '<div class="sold-overlay"><div class="sold-tag">SOLD OUT</div></div>' : ''}
                            ${item.is_sale && !isSold ? '<div class="sale-badge uppercase">Special Offer</div>' : ''}
                            <div class="h-[450px] overflow-hidden">
                                <img src="${item.image_url}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110">
                            </div>
                            <div class="p-10">
                                <div class="flex justify-between items-start mb-6">
                                    <div>
                                        <h3 class="artist-font text-xs uppercase tracking-wider mb-2">${item.title}</h3>
                                        <p class="text-[9px] text-gray-400 font-bold uppercase tracking-[0.2em]">${item.category}</p>
                                    </div>
                                    <div class="text-right text-sm">${priceHTML}</div>
                                </div>
                                ${isSold ? 
                                    `<button disabled class="w-full py-5 border border-gray-100 text-gray-300 rounded-2xl text-[9px] uppercase tracking-[0.3em] cursor-not-allowed">Private Collection</button>` :
                                    `<a href="${waLink}" target="_blank" class="block w-full text-center bg-black text-white py-5 rounded-2xl artist-font text-[9px] uppercase tracking-[0.3em] hover:bg-yellow-400 hover:text-black transition-all">Acquire Artwork</a>`
                                }
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        document.getElementById('newsletter-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.from('subscribers').insert([{ email: document.getElementById('subscriber-email').value }]);
            const status = document.getElementById('news-status');
            status.classList.remove('hidden');
            status.innerText = error ? "Registration Failed" : "Welcome to the Inner Circle!";
        });

        function toggleMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }
        loadShop();
    </script>
</body>
</html>
