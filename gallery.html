<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Store | Bes Artist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        .outline-text { color: transparent; -webkit-text-stroke: 1px black; }
        
        .moving-nav {
            background: linear-gradient(-45deg, #facc15, #000000, #ffffff, #facc15);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-circle { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .art-card { transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .art-card:hover { transform: translateY(-10px); }
        
        .sale-badge {
            position: absolute; top: 15px; left: 15px;
            background: #ef4444; color: white; padding: 4px 12px;
            font-size: 10px; font-weight: 900; border-radius: 5px; z-index: 10;
        }

        /* Admin Modal Style */
        #admin-modal {
            display: none;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="text-[#1a1a1a]">

    <nav class="moving-nav fixed w-full z-[100] border-b border-gray-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-6 h-28 flex justify-between items-center">
            <a href="index.html"><img src="logo.png" alt="Logo" class="logo-circle"></a>
            <div class="hidden md:flex items-center space-x-10 font-bold text-[11px] tracking-[0.2em] uppercase text-white">
                <a href="index.html">Home</a>
                <a href="gallery.html" class="text-yellow-400">Store</a>
                <a href="kuhusu.html">About</a>
                <a href="wasiliana.html">Contact</a>
                <button onclick="openAdmin()" class="bg-white/10 border border-white/20 px-5 py-2 rounded-full hover:bg-white hover:text-black transition flex items-center gap-2">
                    <i class="fa-solid fa-lock text-[10px]"></i> Admin
                </button>
            </div>
            <button onclick="toggleMenu()" class="md:hidden text-white text-3xl"><i class="fa-solid fa-bars-staggered"></i></button>
        </div>
    </nav>

    <main class="pt-48 pb-20 px-6">
        <div class="max-w-7xl mx-auto">
            <header class="mb-16">
                <span class="inline-block py-1 px-4 mb-4 text-[10px] font-bold tracking-[0.4em] bg-black text-white rounded-full uppercase">Exclusive Sales</span>
                <h1 class="artist-font text-5xl md:text-7xl uppercase">The <span class="outline-text">Showroom.</span></h1>
            </header>

            <div id="shop-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
                <p class="text-center col-span-full py-20 text-gray-400">Curating the finest pieces...</p>
            </div>
        </div>
    </main>

    <section class="bg-black py-24 px-6 text-center text-white border-t border-gray-900">
        <div class="max-w-3xl mx-auto">
            <h2 class="artist-font text-2xl md:text-4xl mb-6 uppercase">Get <span class="text-yellow-400">New Art</span> Alerts</h2>
            <form id="newsletter-form" class="flex flex-col sm:flex-row gap-4">
                <input type="email" placeholder="ENTER YOUR EMAIL" class="flex-1 bg-white/5 border border-white/10 px-6 py-4 rounded-xl focus:border-yellow-400 outline-none">
                <button class="bg-yellow-400 text-black px-8 py-4 rounded-xl font-bold uppercase text-[10px] tracking-widest">Sign Up</button>
            </form>
        </div>
    </section>

    <div id="admin-modal" class="fixed inset-0 z-[200] flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-md rounded-[40px] p-10 relative shadow-2xl">
            <button onclick="closeAdmin()" class="absolute top-8 right-8 text-gray-400 hover:text-black text-2xl">&times;</button>
            
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-yellow-400 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h2 class="artist-font text-xl uppercase tracking-widest">Admin Access</h2>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-2">Authorized Personnel Only</p>
            </div>

            <form id="admin-login-form" class="space-y-6">
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest ml-1">Email Address</label>
                    <input type="email" id="admin-email" required class="w-full mt-2 bg-gray-50 border border-gray-100 p-4 rounded-2xl outline-none focus:border-yellow-400 transition">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest ml-1">Secret Key</label>
                    <input type="password" id="admin-password" required class="w-full mt-2 bg-gray-50 border border-gray-100 p-4 rounded-2xl outline-none focus:border-yellow-400 transition">
                </div>
                <button type="submit" class="w-full bg-black text-white py-5 rounded-2xl artist-font text-[10px] uppercase tracking-[0.3em] hover:bg-yellow-400 hover:text-black transition-all">
                    Unlock Dashboard
                </button>
            </form>
            <p id="login-error" class="text-red-500 text-[10px] mt-4 text-center uppercase font-bold hidden">Invalid Credentials</p>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        // Modal Controls
        function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; }
        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

        // Login Handler
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                document.getElementById('login-error').classList.remove('hidden');
            } else {
                // Ikifanikiwa, mpeleke kwenye dashboard
                window.location.href = 'admin-dashboard.html';
            }
        });

        // Load Shop (Simulated for this code)
        async function fetchShop() {
            const grid = document.getElementById('shop-grid');
            const { data } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
            
            if (data) {
                grid.innerHTML = data.map(item => `
                    <div class="art-card bg-white rounded-[30px] overflow-hidden shadow-lg border border-gray-100 relative group">
                        ${item.is_sale ? '<div class="sale-badge">SALE</div>' : ''}
                        <img src="${item.image_url}" class="w-full h-[350px] object-cover transition duration-700 group-hover:scale-110">
                        <div class="p-8">
                            <h3 class="artist-font text-xs uppercase mb-2">${item.title}</h3>
                            <div class="flex justify-between items-center mb-6">
                                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">${item.category}</span>
                                <span class="font-black text-sm text-black">Tsh ${item.price}</span>
                            </div>
                            <button class="w-full border-2 border-black py-4 rounded-xl artist-font text-[9px] uppercase tracking-[0.2em] hover:bg-black hover:text-white transition">Acquire Piece</button>
                        </div>
                    </div>
                `).join('');
            }
        }
        fetchShop();
    </script>
</body>
</html>
