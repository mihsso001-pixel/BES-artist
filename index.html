<!DOCTYPE html>
<html lang="sw" class="scroll-smooth">
<head>

    <style>

<body class="bg-[#fafafa] text-[#1a1a1a]">

    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="Logo" class="h-10 md:h-12 w-auto object-contain">
            </a>
            <div class="hidden md:flex space-x-10 font-bold text-[11px] tracking-[0.2em] uppercase">
                <a href="index.html" class="text-black border-b-2 border-black">Nyumbani</a>
                <a href="gallery.html" class="text-gray-400 hover:text-black transition">Gallery</a>
                <a href="#tiktok" class="text-gray-400 hover:text-black transition">TikTok</a>
                <a href="#wasiliana" class="text-gray-400 hover:text-black transition">Wasiliana</a>
            </div>
            <button class="md:hidden text-xl"><i class="fa-solid fa-bars-staggered"></i></button>
        </div>
    </nav>

    <section class="relative min-h-screen flex items-center justify-center pt-20 px-6">
        <div class="text-center">
            <span class="inline-block py-1 px-4 mb-6 text-[10px] font-bold tracking-[0.4em] bg-black text-white rounded-full uppercase">Official Portfolio</span>
            <h1 class="artist-font text-5xl md:text-8xl mb-6 leading-[0.9]">BES <br><span class="text-transparent" style="-webkit-text-stroke: 1px black;">ARTIST.</span></h1>
            <p class="max-w-lg mx-auto text-gray-500 mb-10 text-lg leading-relaxed font-light">Mchoraji Brayan: Akileta maisha kwenye karatasi kupitia sanaa ya kisasa.</p>
            <div class="flex flex-col md:flex-row gap-4 justify-center">
                <a href="gallery.html" class="bg-black text-white px-10 py-5 text-xs font-bold tracking-widest hover:bg-gray-800 transition">TAZAMA GALLERY</a>
                <a href="#tiktok" class="border border-black px-10 py-5 text-xs font-bold tracking-widest hover:bg-black hover:text-white transition">ANGALIA VIDEO</a>
            </div>
        </div>
    </section>

    <section id="tiktok" class="py-24 bg-white border-y border-gray-100 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-16">
                <h2 class="artist-font text-3xl md:text-4xl mb-4 text-center">TikTok Creations</h2>
                <div class="h-1 w-20 bg-black mx-auto"></div>
            </div>
            <div id="tiktok-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 text-center">
                <p class="col-span-full">Inapakia video za Brayan...</p>
            </div>
        </div>
    </section>

    <footer id="wasiliana" class="bg-black text-white py-20 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <img src="logo.png" alt="Logo" class="h-12 mx-auto mb-8 invert brightness-0">
            <div class="flex justify-center space-x-8 mb-12">
                <a href="#" class="text-2xl hover:text-pink-500 transition"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="text-2xl hover:text-red-500 transition"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#" class="text-2xl hover:text-green-500 transition"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
            <p class="text-[10px] tracking-[0.2em] text-gray-500 uppercase">&copy; 2026 Bes Artist | MSANII BRAYAN</p>
        </div>
    </footer>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script async src="https://www.tiktok.com/embed.js"></script>

    <script>
        // KODI ZA KUUNGANISHA SUPABASE (ZIMESHAJAZWA)
        const _supabaseURL = 'https://vqcenfhmngesfbvtvr m t.supabase.co'; 
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxY2VuZmhtbmdlc2ZidnR2cm10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk2MjEsImV4cCI6MjA4NTQzNTYyMX0.6-XNJ8QLrjct8BEcYI6Jv-pUWiCUuBTci9UkSio4AQM';
        
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function fetchVideos() {
            const container = document.getElementById('tiktok-container');
            
            try {
                const { data, error } = await supabaseClient
                    .from('videos')
                    .select('*');

                if (error) throw error;

                if (data && data.length > 0) {
                    container.innerHTML = '';
                    data.forEach(item => {
                        container.innerHTML += `
                            <div class="fade-in bg-white rounded-2xl overflow-hidden shadow-xl border border-gray-100">
                                <blockquote class="tiktok-embed" cite="${item.video_url}" data-video-id="${item.video_id}" style="max-width: 605px; min-width: 325px;">
                                    <section>Inapakia...</section>
                                </blockquote>
                            </div>`;
                    });
                    if (window.TiktokJS) { window.TiktokJS.load(); }
                } else {
                    container.innerHTML = '<p class="col-span-full">Hakuna video zilizopatikana kwenye Database.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p class="col-span-full text-red-500">Kuna tatizo la kuunganisha na Supabase.</p>';
            }
        }
        fetchVideos();
    </script>
</body>
</html>
