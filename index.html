<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        
        .outline-text {
            color: transparent;
            -webkit-text-stroke: 1px black;
        }
        .outline-text-white {
            color: transparent;
            -webkit-text-stroke: 1px white;
        }

        .moving-nav {
            background: linear-gradient(-45deg, #facc15, #000000, #ffffff, #facc15);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-circle {
            width: 70px; height: 70px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @media (min-width: 768px) { .logo-circle { width: 90px; height: 90px; } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .video-card {
            min-width: 85vw; 
            scroll-snap-align: center;
        }
        @media (min-width: 768px) {
            .video-card { min-width: auto; }
        }
    </style>
</head>
<body class="bg-[#fafafa] text-[#1a1a1a]">

    <nav class="moving-nav fixed w-full z-[100] border-b border-gray-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-6 h-28 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="Bes Artist" class="logo-circle transition-transform hover:scale-110">
            </a>

            <div class="hidden md:flex space-x-10 font-bold text-[11px] tracking-[0.2em] uppercase text-white">
                <a href="index.html" class="border-b-2 border-yellow-400">Home</a>
                <a href="gallery.html" class="hover:text-yellow-400 transition">Gallery</a>
                <a href="kuhusu.html" class="hover:text-yellow-400 transition">About</a>
                <a href="wasiliana.html" class="hover:text-yellow-400 transition">Contact</a>
            </div>

            <button onclick="toggleMenu()" class="md:hidden text-white text-3xl focus:outline-none">
                <i class="fa-solid fa-bars-staggered" id="menu-icon"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden flex-col bg-black text-white p-8 space-y-6 font-bold text-center tracking-widest uppercase text-xs border-t border-gray-900 shadow-2xl transition-all duration-300">
            <a href="index.html" class="text-yellow-400">Home</a>
            <a href="gallery.html" class="hover:text-yellow-400">Gallery</a>
            <a href="kuhusu.html" class="hover:text-yellow-400">About</a>
            <a href="wasiliana.html" class="hover:text-yellow-400">Contact</a>
        </div>
    </nav>

    <section class="pt-56 pb-10 px-6 text-center">
        <span class="inline-block py-1 px-4 mb-6 text-[10px] font-bold tracking-[0.4em] bg-black text-white rounded-full uppercase">Official Portfolio</span>
        <h1 class="artist-font text-5xl md:text-8xl leading-[0.9] uppercase">
            BES <br> <span class="outline-text">ARTIST.</span>
        </h1>
        <p class="max-w-lg mx-auto text-gray-500 mt-6 text-sm uppercase tracking-widest font-bold">Brian Erick | Contemporary Visual Artist</p>
    </section>

    <div class="py-10 text-center flex flex-col md:flex-row justify-center items-center gap-10 px-6">
        <a href="gallery.html" class="bg-black text-white px-12 py-5 text-xs font-bold tracking-[0.4em] hover:bg-yellow-400 hover:text-black transition uppercase border border-black shadow-2xl w-full md:w-72">
            Explore Gallery
        </a>

        <div class="relative w-full md:w-72 group">
            <form id="collector-form" class="flex flex-col gap-2">
                <input type="email" id="collector-email" placeholder="ENTER EMAIL FOR UPDATES" required 
                    class="bg-transparent border-b-2 border-black py-4 px-2 text-[10px] font-bold tracking-widest outline-none focus:border-yellow-400 transition-colors uppercase w-full">
                <button type="submit" id="join-btn" class="text-[9px] font-black tracking-[0.3em] uppercase hover:text-yellow-500 transition text-left pl-2 mt-2">
                    Join Collectors <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                </button>
            </form>
        </div>
    </div>

    <section id="tiktok" class="py-12 overflow-hidden">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="artist-font text-2xl mb-10 text-center uppercase tracking-widest">Creative Feed</h2>
        </div>
        
        <div id="tiktok-container" class="flex md:grid md:grid-cols-3 gap-6 overflow-x-auto no-scrollbar snap-x snap-mandatory px-6 pb-10">
            <p class="text-center col-span-full text-gray-400 italic">Curating visual experiences...</p>
        </div>
    </section>

    <footer id="wasiliana" class="bg-black text-white py-20 px-6 text-center border-t border-gray-800 mt-20">
        <div class="max-w-7xl mx-auto">
            <p class="artist-font text-lg mb-12 tracking-widest outline-text-white uppercase" style="-webkit-text-stroke: 1px white;">Connect with Brian</p>
            
            <div class="flex flex-wrap justify-center gap-10 mb-16">
                <a href="https://www.youtube.com/@BrianErick-arts" target="_blank" title="YouTube" class="text-3xl hover:text-red-600 transition">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a href="https://www.tiktok.com/@brianartstudio1" target="_blank" title="TikTok" class="text-3xl hover:text-pink-500 transition">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://www.instagram.com/Noone33989" target="_blank" title="Instagram" class="text-3xl hover:text-pink-600 transition">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.facebook.com/search/top?q=Brian%20Erick" target="_blank" title="Facebook" class="text-3xl hover:text-blue-600 transition">
                    <i class="fa-brands fa-facebook"></i>
                </a>
                <a href="https://wa.me/255754494949" target="_blank" title="WhatsApp" class="text-3xl hover:text-green-500 transition">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
            </div>

            <div class="pt-10 border-t border-gray-900 text-[10px] tracking-[0.3em] text-gray-600 uppercase font-bold">
                &copy; 2026 Brian (Bes Artist) | Visual Content Creator
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // NAVIGATION TOGGLE
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
                icon.classList.replace('fa-bars-staggered', 'fa-xmark');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                icon.classList.replace('fa-xmark', 'fa-bars-staggered');
            }
        }

        // SUPABASE CONFIGURATION
        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        // JOIN COLLECTORS FUNCTIONALITY
        document.getElementById('collector-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('collector-email');
            const joinBtn = document.getElementById('join-btn');
            const email = emailInput.value;

            joinBtn.innerText = "LINKING TO VAULT...";
            joinBtn.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from('subscribers')
                    .insert([{ email: email }]);

                if (error) {
                    if (error.code === '23505') throw new Error("This email is already in the vault.");
                    throw error;
                }

                alert("Welcome to the Vault! You will now receive exclusive updates.");
                emailInput.value = '';
            } catch (err) {
                alert(err.message);
            } finally {
                joinBtn.innerHTML = 'Join Collectors <i class="fa-solid fa-arrow-right ml-2"></i>';
                joinBtn.disabled = false;
            }
        });

        // FETCH TIKTOK VIDEOS
        async function fetchVideos() {
            const container = document.getElementById('tiktok-container');
            const { data, error } = await supabaseClient
                .from('videos')
                .select('*')
                .order('created_at', { ascending: false });

            if (data && data.length > 0) {
                container.innerHTML = ''; 
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="video-card bg-white rounded-3xl overflow-hidden shadow-2xl border border-gray-100 p-2">
                            <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@brianartstudio1/video/${item.video_id}" data-video-id="${item.video_id}" style="width: 100%;">
                                <section><a target="_blank" href="https://www.tiktok.com/@brianartstudio1">@brianartstudio1</a></section>
                            </blockquote>
                        </div>`;
                });

                const script = document.createElement('script');
                script.src = "https://www.tiktok.com/embed.js";
                script.async = true;
                document.body.appendChild(script);
            }
        }
        fetchVideos();
    </script>
</body>
</html>
