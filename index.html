<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bes Artist | Official Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        
        .outline-text {
            color: transparent;
            -webkit-text-stroke: 1px black;
        }

        .moving-nav {
            background: linear-gradient(-45deg, #facc15, #000000, #ffffff, #facc15);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Circular Logo Styling */
        .logo-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @media (min-width: 768px) {
            .logo-circle { width: 90px; height: 90px; }
        }

        .video-wrapper {
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
        }
        @media (min-width: 768px) {
            .video-wrapper { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body class="bg-[#fafafa] text-[#1a1a1a]">

    <nav class="moving-nav fixed w-full z-[100] border-b border-gray-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-6 h-28 flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <img src="logo.png" alt="Bes Artist" class="logo-circle transition-transform hover:scale-110">
            </a>

            <div class="hidden md:flex space-x-10 font-bold text-[11px] tracking-[0.2em] uppercase text-white">
                <a href="index.html" class="border-b-2 border-yellow-400">Home</a>
                <a href="gallery.html" class="hover:text-yellow-400 transition">Gallery</a>
                <a href="kuhusu.html" class="hover:text-yellow-400 transition">About</a>
                <a href="wasiliana.html" class="hover:text-yellow-400 transition">Contact</a>
            </div>

            <button onclick="toggleMenu()" class="md:hidden text-white text-3xl focus:outline-none">
                <i class="fa-solid fa-bars-staggered" id="menu-icon"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden flex-col bg-black text-white p-6 space-y-4 font-bold text-center tracking-widest uppercase text-xs border-t border-gray-800 shadow-2xl">
            <a href="index.html" class="text-yellow-400">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="kuhusu.html">About Bes</a>
            <a href="wasiliana.html">Contact</a>
        </div>
    </nav>

    <section class="pt-56 pb-10 px-6 text-center">
        <span class="inline-block py-1 px-4 mb-6 text-[10px] font-bold tracking-[0.4em] bg-black text-white rounded-full uppercase">Official Portfolio</span>
        <h1 class="artist-font text-5xl md:text-8xl leading-[0.9] uppercase">
            BES <br> <span class="outline-text">ARTIST.</span>
        </h1>
        <p class="max-w-lg mx-auto text-gray-500 mt-6 text-sm uppercase tracking-widest font-bold">Brayan | Contemporary Visual Artist</p>
    </section>

    <section id="tiktok" class="py-12 px-6">
        <div class="max-w-7xl mx-auto">
            <h2 class="artist-font text-2xl mb-10 text-center uppercase tracking-widest">Creative Feed</h2>
            <div id="tiktok-container" class="video-wrapper">
                <p class="text-center col-span-full text-gray-400 italic">Curating visual experiences...</p>
            </div>
        </div>
    </section>

    <div class="py-10 text-center">
        <a href="gallery.html" class="bg-black text-white px-12 py-5 text-xs font-bold tracking-[0.4em] hover:bg-yellow-400 hover:text-black transition uppercase border border-black shadow-2xl">
            Explore Gallery
        </a>
    </div>

    <footer id="wasiliana" class="bg-black text-white py-20 px-6 text-center border-t border-gray-800 mt-20">
        <div class="max-w-7xl mx-auto">
            <p class="artist-font text-lg mb-12 tracking-widest outline-text uppercase">Connect with Bes</p>
            
            <div class="flex flex-wrap justify-center gap-10 mb-16">
                <a href="https://youtube.com/@USERNAME" target="_blank" class="text-3xl hover:text-red-600 transition"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://tiktok.com/@USERNAME" target="_blank" class="text-3xl hover:text-pink-500 transition"><i class="fa-brands fa-tiktok"></i></a>

                <a href="https://wa.me/255XXXXXXXXX" target="_blank" class="text-3xl hover:text-green-500 transition"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
            
            <div class="pt-10 border-t border-gray-900 text-[10px] tracking-[0.3em] text-gray-600 uppercase font-bold">
                &copy; 2026 Bes Artist | Visual Content Creator
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script async src="https://www.tiktok.com/embed.js"></script>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            if (menu.classList.contains('flex')) {
                icon.classList.replace('fa-bars-staggered', 'fa-xmark');
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars-staggered');
            }
        }

        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function fetchVideos() {
            const container = document.getElementById('tiktok-container');
            
            // Tunachukua video toka Supabase
            const { data, error } = await supabaseClient
                .from('videos')
                .select('*')
                .order('created_at', { ascending: false });

            if (data && data.length > 0) {
                container.innerHTML = ''; // Futa loading text
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="bg-white rounded-3xl overflow-hidden shadow-2xl border border-gray-100 p-2 transition-transform hover:scale-[1.02]">
                            <blockquote class="tiktok-embed" cite="${item.video_url}" data-video-id="${item.video_id}" style="width: 100%;">
                                <section>Loading creative work...</section>
                            </blockquote>
                        </div>`;
                });

                // Hii inalazimisha TikTok i-load video baada ya kuziweka kwenye HTML
                if (window.twttr) { } 
                if (typeof window.TiktokJS !== 'undefined') {
                    window.TiktokJS.load();
                }
            } else if (error) {
                container.innerHTML = `<p class="text-center text-red-400">Error loading feed. Please refresh.</p>`;
            }
        }
        
        // Tunaita function
        fetchVideos();
    </script>
</body>
</html>
