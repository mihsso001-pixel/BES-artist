<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bes Artist | Global Admin Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #e5e5e5; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-pro { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 15px; width: 100%; outline: none; transition: 0.3s; color: white; }
        .input-pro:focus { border-color: #facc15; }
        .btn-main { background: #facc15; color: #000; font-weight: 900; transition: 0.4s; text-transform: uppercase; letter-spacing: 2px; }
        .btn-main:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="border-b border-white/5 py-6 px-8 flex justify-between items-center sticky top-0 bg-[#050505]/90 backdrop-blur-xl z-[100]">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-black font-black">B</div>
            <h1 class="artist-font text-sm uppercase tracking-tighter">Bes <span class="text-yellow-400">Admin</span></h1>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="text-[9px] font-bold uppercase border border-white/10 px-5 py-2 rounded-full hover:bg-white hover:text-black transition">Home</a>
            <button onclick="logout()" class="text-[9px] font-bold uppercase bg-red-600/10 text-red-500 px-5 py-2 rounded-full border border-red-500/20">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-12 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-8 space-y-10">
            
            <div class="glass p-8 rounded-[40px]">
                <h2 class="artist-font text-xs uppercase mb-8 flex items-center gap-3 text-yellow-400">
                    <i class="fa-solid fa-palette"></i> Publish Masterpiece
                </h2>
                <form id="upload-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="title" placeholder="ARTWORK TITLE" required class="input-pro text-xs">
                        <input type="text" id="category" placeholder="CATEGORY" class="input-pro text-xs">
                    </div>
                    <textarea id="description" placeholder="THE ARTWORK STORY" rows="2" class="input-pro text-xs"></textarea>
                    <input type="file" id="image_file" accept="image/*" class="input-pro text-xs">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <input type="number" id="price" placeholder="PRICE" class="input-pro text-xs">
                        <select id="currency" class="input-pro text-xs uppercase font-bold"><option value="TZS">TZS</option><option value="USD">USD</option></select>
                        <select id="stock_status" class="input-pro text-xs font-bold"><option value="Available">AVAILABLE</option><option value="Sold Out">SOLD OUT</option></select>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full btn-main py-5 rounded-2xl text-[10px]">Release Art</button>
                </form>
            </div>

            <div class="glass p-8 rounded-[40px]">
                <h2 class="artist-font text-xs uppercase mb-8 flex items-center gap-3 text-pink-500">
                    <i class="fa-brands fa-tiktok"></i> TikTok Manager
                </h2>
                <form id="tiktok-form" class="flex flex-col md:flex-row gap-4 mb-8">
                    <input type="text" id="video_id_input" placeholder="PASTE VIDEO ID (mfano: 73456789...)" required 
                        class="input-pro text-xs flex-1">
                    <button type="submit" id="add-video-btn" class="bg-pink-600 hover:bg-pink-500 text-white px-8 py-4 rounded-2xl font-black text-[10px] uppercase transition md:w-48">
                        Add Video
                    </button>
                </form>
                
                <h3 class="text-[9px] uppercase tracking-[0.2em] mb-4 opacity-50 font-bold">Live Videos on Web</h3>
                <div id="admin-tiktok-list" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    </div>
            </div>
        </div>

        <div class="lg:col-span-4 space-y-10">
            <div class="glass p-8 rounded-[40px]">
                <h3 class="artist-font text-xs uppercase mb-6 flex justify-between">Live Art <span id="item-count" class="text-yellow-400">0</span></h3>
                <div id="art-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>

            <div class="glass p-8 rounded-[40px]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="artist-font text-xs uppercase">Collectors</h3>
                    <button onclick="emailAll()" class="text-[8px] font-black bg-yellow-400 text-black px-3 py-1 rounded-lg uppercase">Broadcast</button>
                </div>
                <div id="sub-list" class="space-y-2 max-h-[200px] overflow-y-auto custom-scrollbar"></div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = 'gallery.html';
            else loadData();
        }

        async function loadData() {
            // Load Arts
            const { data: arts } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
            if(arts) {
                document.getElementById('art-list').innerHTML = arts.map(a => `
                    <div class="p-3 bg-white/5 rounded-2xl flex items-center justify-between border border-white/5">
                        <img src="${a.image_url}" class="w-10 h-10 rounded-lg object-cover">
                        <button onclick="deleteArt('${a.id}')" class="text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
                document.getElementById('item-count').innerText = arts.length;
            }

            // Load TikToks
            const { data: vids } = await supabaseClient.from('videos').select('*').order('created_at', { ascending: false });
            if(vids) {
                document.getElementById('admin-tiktok-list').innerHTML = vids.map(v => `
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center">
                        <p class="text-[8px] mb-2 opacity-50">ID: ${v.video_id}</p>
                        <button onclick="deleteVideo('${v.id}')" class="text-red-500 hover:text-white text-[9px] font-bold uppercase">
                            <i class="fa-solid fa-trash-can mr-1"></i> Remove
                        </button>
                    </div>
                `).join('');
            }

            // Load Subs
            const { data: subs } = await supabaseClient.from('subscribers').select('*');
            if(subs) {
                document.getElementById('sub-list').innerHTML = subs.map(s => `
                    <div class="text-[9px] opacity-60 border-b border-white/5 pb-1">${s.email}</div>
                `).join('');
            }
        }

        // TIKTOK FUNCTIONS
        document.getElementById('tiktok-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('video_id_input');
            const btn = document.getElementById('add-video-btn');
            const id = input.value.trim();

            btn.innerText = "ADDING...";
            btn.disabled = true;

            const { error } = await supabaseClient.from('videos').insert([{ video_id: id }]);

            if(!error) {
                input.value = '';
                loadData();
            } else {
                alert(error.message);
            }
            btn.innerText = "ADD VIDEO";
            btn.disabled = false;
        });

        async function deleteVideo(db_id) {
            if(confirm("Futa video hii?")) {
                const { error } = await supabaseClient.from('videos').delete().eq('id', db_id);
                if(!error) loadData();
            }
        }

        // ART FUNCTIONS (Kodi zako za asili)
        async function deleteArt(id) {
            if(confirm("Futa artwork hii?")) {
                const { error } = await supabaseClient.from('gallery').delete().eq('id', id);
                if(!error) loadData();
            }
        }

        async function logout() { 
            await supabaseClient.auth.signOut(); 
            window.location.href = 'gallery.html'; 
        }

        checkAuth();
    </script>
</body>
</html>
