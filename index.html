<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bes Artist | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; /* Inazuia scroll kabisa */
            font-family: 'Inter', sans-serif; 
        }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        
        /* Artist Outline Style */
        .outline-text {
            color: transparent;
            -webkit-text-stroke: 1px black;
        }

        /* Moving Gradient Nav */
        .moving-nav {
            background: linear-gradient(-45deg, #facc15, #000000, #ffffff, #facc15);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* TikTok Slider - Kwa Simu inasogea pembeni */
        .tiktok-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 12px;
            scrollbar-width: none;
        }
        .tiktok-slider::-webkit-scrollbar { display: none; }
        
        .tiktok-card {
            flex: 0 0 70%; /* Video ndogo kiasi ili kuona vingine */
            scroll-snap-align: center;
            transform: scale(0.9); /* Inafanya video iwe ndogo kijanja */
        }

        @media (min-width: 768px) {
            .tiktok-card { flex: 0 0 25%; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-[#fafafa] flex flex-col justify-between h-screen">

            <button onclick="toggleMenu()" class="md:hidden text-white text-xl">

        </div>

        <div id="mobile-menu" class="hidden flex-col bg-black/95 text-white p-6 space-y-4 font-bold text-center tracking-widest uppercase text-xs absolute w-full">

    <main class="flex-grow flex flex-col justify-around py-4 overflow-hidden">

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            icon.classList.toggle('fa-bars-staggered');
            icon.classList.toggle('fa-xmark');
        }

        // Supabase Config
        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function fetchVideos() {
            const container = document.getElementById('tiktok-container');
            const { data } = await supabaseClient.from('videos').select('*');
            if (data && data.length > 0) {
                container.innerHTML = '';
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="tiktok-card bg-white rounded-lg shadow-xl overflow-hidden flex-shrink-0">
                            <blockquote class="tiktok-embed" cite="${item.video_url}" data-video-id="${item.video_id}" style="width: 100%;">
                                <section></section>
                            </blockquote>
                        </div>`;
                });
                if (window.TiktokJS) { window.TiktokJS.load(); }
            }
        }
        fetchVideos();
    </script>
