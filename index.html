<!DOCTYPE html>
<html lang="sw" class="scroll-smooth">

    <meta charset="UTF-8">

    <title>Bes Artist | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        
        /* Artist Outline Style kama ulivyotaka */
        .outline-text {
            color: transparent;
            -webkit-text-stroke: 1px black;
        }

        /* Moving Gradient Nav (Yellow, Black, White) */
        .moving-nav {
            background: linear-gradient(-45deg, #facc15, #000000, #ffffff, #facc15);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Video Container kwa ajili ya Simu (Zitajipanga vizuri) */
        .video-wrapper {
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .video-wrapper {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body class="bg-[#fafafa] text-[#1a1a1a]">

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script async src="https://www.tiktok.com/embed.js"></script>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            if (menu.classList.contains('flex')) {
                icon.classList.replace('fa-bars-staggered', 'fa-xmark');
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars-staggered');
            }
        }

        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function fetchVideos() {
            const container = document.getElementById('tiktok-container');
            const { data, error } = await supabaseClient.from('videos').select('*');
            if (data && data.length > 0) {
                container.innerHTML = '';
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="bg-white rounded-2xl overflow-hidden shadow-2xl border border-gray-100 p-1">
                            <blockquote class="tiktok-embed" cite="${item.video_url}" data-video-id="${item.video_id}" style="width: 100%;">
                                <section>Loading...</section>
                            </blockquote>
                        </div>`;
                });
                if (window.TiktokJS) { window.TiktokJS.load(); }
            }
        }
        fetchVideos();
    </script>
