<!DOCTYPE html>

    <title>Bes Artist | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Bakia na mifumo ileile ya mwanzo */
        body { font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .artist-font { font-family: 'Unbounded', sans-serif; }
        
        .moving-nav {
            background: linear-gradient(-45deg, #facc15, #000000, #ffffff, #facc15);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Video Horizontal kwa Simu (Inayozuia Scroll ya juu-chini) */
        #tiktok-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            gap: 1rem;
        }
        #tiktok-container::-webkit-scrollbar { display: none; }
        
        .video-card {
            flex: 0 0 85%; /* Kwa simu */
            scroll-snap-align: center;
        }

        @media (min-width: 768px) {
            body { overflow-y: auto; } /* PC inaweza kuscrool kidogo */
            .video-card { flex: 0 0 30%; }
        }
    </style>
</head>
<body class="bg-[#fafafa] text-[#1a1a1a]">

    <script async src="https://www.tiktok.com/embed.js"></script>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            icon.classList.toggle('fa-bars-staggered');
            icon.classList.toggle('fa-xmark');
        }

        const _supabaseURL = 'https://czifyhpvtdesbwpofbmv.supabase.co';
        const _supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aWZ5aHB2dGRlc2J3cG9mYm12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTk0NzMsImV4cCI6MjA4NTQzNTQ3M30.p88aKBMn5Sz5ZXW7cSzL1APW3Ow1hax8k1pUZbCojUg';
        const supabaseClient = supabase.createClient(_supabaseURL, _supabaseKey);

        async function fetchVideos() {
            const container = document.getElementById('tiktok-container');
            const { data } = await supabaseClient.from('videos').select('*');
            if (data && data.length > 0) {
                container.innerHTML = '';
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="video-card bg-white rounded-xl shadow-lg overflow-hidden flex-shrink-0">
                            <blockquote class="tiktok-embed" cite="${item.video_url}" data-video-id="${item.video_id}" style="width: 100%;">
                                <section></section>
                            </blockquote>
                        </div>`;
                });
                if (window.TiktokJS) { window.TiktokJS.load(); }
            }
        }
        fetchVideos();
    </script>
